      - generic [ref=e203]:
        - heading "Requisitos previos" [level=2] [ref=e209]
        - generic [ref=e211]:
          - list [ref=e212]:
            - listitem [ref=e213]:
              - text: Revisa las
              - link "notas de la versión" [ref=e214] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/?linkid=2226147
              - text: y los
              - link "requisitos del sistema" [ref=e215] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/?linkid=2226339
              - text: de Windows Server 2016.
            - listitem [ref=e216]: Regístrate, descarga e instala. Las ediciones de evaluación de Windows Server 2016 expiran en 180 días.
            - listitem [ref=e217]: Recibe un correo electrónico con recursos que te guiarán a lo largo de la evaluación.
          - heading "Directrices de instalación" [level=3] [ref=e218]
          - paragraph [ref=e220]: Después de la instalación, instala el paquete de servicio más reciente.
          - list [ref=e221]:
            - listitem [ref=e222]:
              - text: "Ve a:"
              - link "Catálogo de actualización de Microsoft" [ref=e223] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/?linkid=2226048
              - text: y busca "Windows Server 2016".
            - listitem [ref=e224]: Las versiones de Windows Server deben estar activas en internet en los primeros 10 días para evitar el cierre automático.
          - paragraph [ref=e225]: La opción de implementación en la evaluación de Windows Server 2016 ISO se admite para implementaciones de máquina virtual de host e invitado hasta la versión de primavera 2018 de Windows Server. A partir de la versión de otoño de 2017, Nano Server se ha optimizado solo para uso de contenedor y Server Core está disponible para implementaciones de máquina virtual de host e invitado.
          - paragraph [ref=e226]
