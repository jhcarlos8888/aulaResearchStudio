      - generic [ref=f2e102]:
        - heading "Descripción" [level=2] [ref=f2e105]
        - generic [ref=f2e107]:
          - paragraph [ref=f2e108]: Windows Server 2016 es el sistema operativo preparado para la nube que ofrece nuevas capas de seguridad e innovación inspirada en Azure para las aplicaciones y la infraestructura que potencia tu empresa.
          - paragraph [ref=f2e109]:
            - text: Además de descargarte el archivo ISO,
            - link "Más información acerca de Windows Server en Azure" [ref=f2e110] [cursor=pointer]:
              - /url: https://go.microsoft.com/fwlink/p/?linkid=2197136
              - text: ejecuta Windows Server en Azure
            - text: . Azure ofrece una excelente manera de probar Windows Server 2016 con imágenes pregeneradas.
          - heading "Elige una edición y una opción de instalación:" [level=3] [ref=f2e111]
          - paragraph [ref=f2e113]: Los clientes que se descarguen el archivo ISO completo deberán elegir una edición y una opción de instalación. Esta evaluación de archivo ISO es para las ediciones Datacenter y Standard. La edición Datacenter es la más completa e incluye las nuevas características específicas del centro de datos (máquinas virtuales blindadas, espacios de almacenamiento directo, réplica de almacenamiento y redes definidas por software), además de una virtualización del servidor ilimitada.
          - paragraph [ref=f2e114]: "Opciones de instalación:"
          - list [ref=f2e115]:
            - listitem [ref=f2e116]:
              - strong [ref=f2e117]: "Server Core:"
              - text: esta es la opción de instalación recomendada. Es una instalación más reducida que incluye los componentes principales de Windows Server y es compatible con todos los roles de servidor, pero no cuenta con una GUI local. Se utiliza en las implementaciones sin interfaz gráfica que se administran de forma remota mediante PowerShell u otras herramientas de administración de servidores.
            - listitem [ref=f2e118]:
              - strong [ref=f2e119]: "Server con Experiencia de escritorio:"
              - text: esta es la instalación integral e incluye una interfaz gráfica de usuario (GUI) completa para los clientes que prefieran esta opción.
          - paragraph [ref=f2e120]:
            - text: Antes de empezar la evaluación, asegúrate de revisar las
            - link "Más información acerca de Windows Server 2016" [ref=f2e121] [cursor=pointer]:
              - /url: https://go.microsoft.com/fwlink/?LinkId=825556
              - text: novedades de Windows Server 2016.
            - text: Cuando termines la evaluación, podrás convertir tus versiones de evaluación en versiones comerciales. Revisa también nuestra
            - link "Leer documentación técnica sobre Windows Server 2016" [ref=f2e122] [cursor=pointer]:
              - /url: https://go.microsoft.com/fwlink/p/?linkid=2197230
              - text: documentación técnica
            - text: para descubrir cómo actualizar o migrar el resto de servidores existentes a Windows Server 2016.
          - paragraph [ref=f2e123]:
            - strong [ref=f2e124]: "Idiomas:"
          - list [ref=f2e125]:
            - listitem [ref=f2e126]: Chino (simplificado), inglés, francés, alemán, italiano, japonés, ruso y español
          - paragraph [ref=f2e127]:
            - strong [ref=f2e128]: Opciones de evaluación
          - list [ref=f2e129]:
            - listitem [ref=f2e130]: Windows Server 2016 | ISO de 64 bits
            - listitem [ref=f2e131]: Windows Server 2016 en Microsoft Azure
      - generic [ref=f2e134]:
        - heading "Requisitos previos" [level=2] [ref=f2e137]
        - generic [ref=f2e139]:
          - list [ref=f2e140]:
            - listitem [ref=f2e141]:
              - text: Revisa las
              - link "Detalles de la nota de la versión de Windows Server 2016" [ref=f2e142] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/p/?linkid=2197232
                - text: notas de la versión
              - text: y los
              - link "Más información acerca de los requisitos del sistema de Windows Server 2016" [ref=f2e143] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/p/?linkid=2197524
                - text: requisitos del sistema
              - text: de Windows Server 2016.
            - listitem [ref=f2e144]: Regístrate, descarga e instala. Las ediciones de evaluación de Windows Server 2016 expiran en 180 días.
            - listitem [ref=f2e145]: Recibe un correo electrónico con recursos que te guiarán a lo largo de la evaluación.
          - heading "Directrices de instalación" [level=3] [ref=f2e146]
          - paragraph [ref=f2e148]: Después de la instalación, instala el paquete de servicio más reciente.
          - list [ref=f2e149]:
            - listitem [ref=f2e150]:
              - text: Dirígete al
              - link "Más información sobre el catálogo de Microsoft Update" [ref=f2e151] [cursor=pointer]:
                - /url: https://go.microsoft.com/fwlink/p/?linkid=2167640
                - text: Catálogo de Microsoft Update
              - text: y busca ""Windows Server 2016".
            - listitem [ref=f2e152]: Las versiones de evaluación de Windows Server deben estar activas en Internet en los primeros 10 días para evitar el cierre automático.
          - paragraph [ref=f2e153]: La opción de implementación en la evaluación de Windows Server 2016 ISO se admite para implementaciones de máquina virtual de host e invitado hasta la versión de primavera 2018 de Windows Server. A partir de la versión de otoño de 2017, Nano Server se ha optimizado solo para uso de contenedor y Server Core está disponible para implementaciones de máquina virtual de host e invitado.
